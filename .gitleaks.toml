# Used by the Security workflow (gitleaks, pinned to 8.24.3 by the action). The default rules
# stay on; this file only adds the exception below, which names the exact value it allows.
# The singular [allowlist] table is the one 8.24.3 reads: `[[allowlists]]` appeared in 8.25
# and is silently ignored by older versions.
title = "SagaShelf gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Clerk publishable keys of the development and production instances. They are public by design (they are served in the page HTML to the browser) and are declared in wrangler.jsonc. The secret key is a Workers secret and never goes in the repository. A new publishable key is added here by its exact value."
regexTarget = "match"
regexes = [
  '''pk_test_bGl0ZXJhdGUtaGFtc3Rlci04MjQ0LmNsZXJrLmFjY291bnRzLmRldiQ''',
  '''pk_live_Y2xlcmsuc2FnYXNoZWxmLmFwcCQ''',
]
